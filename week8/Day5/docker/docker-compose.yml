version: '3.8'

# ==============================================================================
# Production Docker Compose Orchestration
# Week 8 — Day 5 Task 3
# Services: FastAPI Serving Gateway, Streamlit Intelligence Dashboard, PostgreSQL
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Database Service (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: realestate_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-re_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_re_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-realestate_ml_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-re_admin} -d ${POSTGRES_DB:-realestate_ml_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realestate-net

  # ----------------------------------------------------------------------------
  # 2. FastAPI Model Serving Gateway
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: realestate_fastapi_gateway
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-re_admin}:${POSTGRES_PASSWORD:-secure_re_pass_2026}@db:5432/${POSTGRES_DB:-realestate_ml_platform}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ml_models_data:/app/models
      - audit_logs_data:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - realestate-net

  # ----------------------------------------------------------------------------
  # 3. Streamlit Operations Dashboard
  # ----------------------------------------------------------------------------
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: realestate_streamlit_dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://api:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    ports:
      - "8501:8501"
    volumes:
      - ml_models_data:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - realestate-net

networks:
  realestate-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  ml_models_data:
    driver: local
  audit_logs_data:
    driver: local

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Production Persistence)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: zarya_postgres
    restart: always
    environment:
      POSTGRES_DB: zarya_bank
      POSTGRES_USER: zarya_admin
      POSTGRES_PASSWORD: zarya_secure_password
    ports:
      - "5432:5432"
    volumes:
      - zarya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zarya_admin -d zarya_bank"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Unified FastAPI Gateway Service (:8000)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zarya_api
    restart: always
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://zarya_admin:zarya_secure_password@postgres:5432/zarya_bank
      VLLM_API_URL: http://vllm:8000/v1/chat/completions
      OLLAMA_API_URL: http://ollama:11434/api/chat
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 3. Streamlit Customer Portal & Agent Dashboard (:8501)
  # ---------------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zarya_ui
    restart: always
    command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      DATABASE_URL: postgresql://zarya_admin:zarya_secure_password@postgres:5432/zarya_bank
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./data:/app/data

  # ---------------------------------------------------------------------------
  # 4. Optional Local Ollama CPU Fallback Engine (:11434)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: zarya_ollama_fallback
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - zarya_ollama_data:/root/.ollama
      - ./models:/models
      - ./Modelfile:/Modelfile

volumes:
  zarya_pgdata:
  zarya_ollama_data:

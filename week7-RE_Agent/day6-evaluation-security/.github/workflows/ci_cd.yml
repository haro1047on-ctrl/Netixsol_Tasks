name: RealEstate Hub Day 6 CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Lint, Static Typing & Code Formatting
  # -------------------------------------------------------------------------
  lint_and_validate:
    name: 🔍 Lint & Static Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Run Ruff Linter
        run: |
          ruff check day6-evaluation-security/ day5-langgraph-agent/ || true

  # -------------------------------------------------------------------------
  # Job 2: Security & Adversarial Penetration Tests (Task 2)
  # -------------------------------------------------------------------------
  security_penetration_tests:
    name: 🛡️ Security Guardrails & Prompt Injection
    runs-on: ubuntu-latest
    needs: lint_and_validate
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r day6-evaluation-security/requirements-day6.txt

      - name: Run Security Penetration Test Suite
        run: |
          python day6-evaluation-security/security/test_security.py

  # -------------------------------------------------------------------------
  # Job 3: 40+ Conversation Evaluation Suite & Performance Benchmark (Tasks 1 & 3)
  # -------------------------------------------------------------------------
  evaluation_and_benchmarking:
    name: 📊 40+ Conversation Evaluation & Benchmark
    runs-on: ubuntu-latest
    needs: security_penetration_tests
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r day6-evaluation-security/requirements-day6.txt

      - name: Run Full 40+ Conversation Evaluation Suite
        run: |
          python day6-evaluation-security/run_day6.py --bench

      - name: Upload Evaluation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-benchmark-report
          path: |
            day6-evaluation-security/results/eval_report.md
            day6-evaluation-security/results/eval_results.json

  # -------------------------------------------------------------------------
  # Job 4: Docker Container Build & Healthcheck Smoke Test (Task 5)
  # -------------------------------------------------------------------------
  docker_build_and_smoke:
    name: 🐳 Docker Container Build & Smoke Test
    runs-on: ubuntu-latest
    needs: evaluation_and_benchmarking
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: day6-evaluation-security/deployment/Dockerfile
          push: false
          tags: realestate-hub-voice-agent:latest
          load: true

      - name: Run Container & Test Health Probes
        run: |
          docker run -d --name agent-smoke-test -p 8000:8000 realestate-hub-voice-agent:latest
          sleep 5
          docker ps
          curl -f http://localhost:8000/health/liveness || (docker logs agent-smoke-test && exit 1)
          docker stop agent-smoke-test

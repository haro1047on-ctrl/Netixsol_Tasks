name: Zarya Digital Bank — Continuous Integration (CI) Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Safety Audit & Multi-Stage Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Verify PII Sanitization & Stratified Dataset Splits (Day 1)
      run: |
        pytest tests/week10/test_dataset_engineering.py -v

    - name: Verify SFT Baselines, Tokenizer Benchmark & QLoRA Config (Day 2)
      run: |
        pytest tests/week10/test_day2_baselines_and_sft.py -v

    - name: Verify Multi-Dimensional Evaluation Harness & DPO Alignment (Day 3)
      run: |
        pytest tests/week10/test_day3_eval_and_dpo.py -v

    - name: Verify Serving, RAG Hybrid Engine & Multi-Layer Guardrails (Day 4)
      run: |
        pytest tests/week10/test_day4_serving_rag_and_guardrails.py -v

    - name: Verify Deployment, UI Portal & Continuous DPO Pipeline (Day 5)
      run: |
        pytest tests/week10/test_day5_capstone_and_deployment.py -v
